[package]
name = "pico2-es100"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
es100 = { path = "../es100" }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.8.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.0"
embassy-usb-logger = "0.6.0"
log = "0.4.28"
panic-halt = "1.0.0"

[[bin]]
name = "pico2-es100"
path = "src/main.rs"
test = false
bench = false
